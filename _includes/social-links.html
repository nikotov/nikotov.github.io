<ul class="social" role="list">
    <li><a class="icon-btn" href="{{ site.github_url }}" target="_blank" rel="noopener me" aria-label="GitHub profile">{% include icon.html name="github" %}</a></li>
    <li><a class="icon-btn" href="{{ site.linkedin_url }}" target="_blank" rel="noopener me" aria-label="LinkedIn profile">{% include icon.html name="linkedin" %}</a></li>
    <li><a class="icon-btn" href="mailto:{{ site.email }}" aria-label="Email {{ site.email }}">{% include icon.html name="mail" %}</a></li>
</ul>
