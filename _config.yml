email: nicolastovar18@hotmail.com
location: Ecuador
availability: Open to freelance and full-time opportunities
github_url: https://github.com/nikotov
linkedin_url: https://ec.linkedin.com/in/nicol%C3%A1s-tovar-cobos-568b17303
social:
  name: Nicolás Tovar
  links:
    - https://github.com/nikotov
    - https://ec.linkedin.com/in/nicol%C3%A1s-tovar-cobos-568b17303
    - https://nikotov.itch.io

# Integrations. Leave a value empty to turn that feature off.
#   formspree_id: the ID from https://formspree.io/f/<id>. Empty = the contact
#                 form falls back to opening a pre-filled email.
#   itch.url:     the game's itch.io page. Adds a "Play on itch.io" button.
#   itch.embed_*: the src, width and height from itch.io's embed code. Adds the
#                 embed under the Get Otter Here! spotlight.
#   cv:           path to a PDF, e.g. /resources/cv.pdf. Adds a "Download CV" button.
formspree_id:
itch:
  url: https://nikotov.itch.io/get-otter-here
  embed_src: https://itch.io/embed-upload/19266931?color=3c3c3c
  embed_width: 640
  embed_height: 380
cv:

# Search engine verification (rendered by jekyll-seo-tag). Uncomment and paste
# the token from Google Search Console / Bing Webmaster Tools.
# webmaster_verifications:
#   google:
#   bing:

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /resources/og-image.jpg

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - vendor/
  - .bundle/
