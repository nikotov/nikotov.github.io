# Site settings. GitHub Pages builds this site with Jekyll on every push to
# main. Values here are the single source of truth for the name, links and
# integrations used across the layout, includes and SEO tags.

title: Nicolás Tovar
tagline: Developer & Photographer in Ecuador
description: >-
  Nicolás Tovar (Niko), developer and photographer in Ecuador: a Hack2Interact game jam
  winner, open-source tools, and portrait and wildlife photography.
url: https://nikotov.dev
baseurl: ""
lang: en_US
# No Jekyll theme: the layout and CSS are all in this repo.
theme: null

author:
  name: Nicolás Tovar
  url: https://nikotov.dev
  job_title: Developer & Photographer
  # Other spellings people search for; used in the Person structured data.
  alternate_names:
