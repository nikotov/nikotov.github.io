<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Niko's Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Nicolas Tovar (Niko) — creative developer portfolio: projects, gallery, and contact.">
    <link rel="icon" type="image/svg+xml" href="resources/logo.svg">

    <!-- 🚀 Preload hero image so it downloads instantly -->
    <link rel="preload" as="image" href="resources/profile.jpg" fetchpriority="high">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="site-frame">
        <header class="frame-header frame-header--dark">
            <a href="index.html" class="logo-link" aria-label="Niko's homepage">
                <img src="resources/logo.svg" alt="Niko logo" class="logo-mark">
            </a>

            <nav class="top-bar" aria-label="Profile links">
                <a href="https://github.com/nikotov" class="btn btn-outline-light btn-sm rounded-circle" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
                    <i class="fa fa-github"></i>
                </a>
                <a href="https://ec.linkedin.com/in/nicol%C3%A1s-tovar-cobos-568b17303" class="btn btn-outline-light btn-sm rounded-circle" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
                    <i class="fa fa-linkedin"></i>
                </a>
                <a href="mailto:nicolastovar18@hotmail.com" class="btn btn-outline-light btn-sm rounded-4 contact-square-btn" aria-label="Contact page">
                    <i class="fa fa-envelope"></i> Contact
                </a>
            </nav>
        </header>

        <section class="canvas hero-canvas" aria-label="Homepage introduction">
            <div class="hero-grid">
                <div class="hero-copy">
                    <img src="resources/logo.svg" alt="Niko logo" class="hero-logo">

                    <div class="hero-headline">
                        <h2 class="text-info">Innovate</h2>
                        <h2>Build</h2>
                        <h2 class="text-danger">Create_</h2>
                    </div>

                    <p class="hero-lede">
                        I am a creative developer focused on building modern, user-friendly digital experiences.
                        I enjoy turning ideas into clean interfaces and reliable code that solve real problems.
                    </p>
                </div>

                <div class="hero-portrait">
                    <!-- 
                        ✅ No width/height attributes – we use CSS aspect-ratio instead
                        ✅ fetchpriority="high" + preload = instant
                        ✅ decoding="async" = non-blocking decode
                    -->
                    <img src="resources/profile.jpg" 
                         alt="Profile photo of Nicolas Tovar" 
                         class="img-fluid rounded-4 shadow" 
                         fetchpriority="high" 
                         decoding="async">
                </div>
            </div>

            <div class="pill-row" aria-label="Page navigation">
                <span class="stripes" aria-hidden="true"></span>
                <a href="aboutme.html">About me</a>
                <a href="projects.html">Projects</a>
                <a href="gallery.html">Gallery</a>
                <a href="contact.html">Contact</a>
                <span class="stripes" aria-hidden="true"></span>
            </div>
        </section>

        <footer class="frame-footer">
            <small>&copy; 2026 Nicolas Tovar. All rights reserved.</small>
        </footer>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
